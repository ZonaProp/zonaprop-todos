<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>598 Departamentos · ZonaProp Premium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#222}
header{background:#1a1a2e;color:#fff;padding:1rem;text-align:center;font-weight:700}
header span{color:#ff5500}
h1{text-align:center;padding:1.2rem 1rem .4rem;font-size:1.35rem;font-weight:800}
.search{max-width:1140px;margin:0 auto 1rem;padding:0 1rem}
.search-box{background:#fff;border-radius:14px;padding:1rem;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.search-row{display:flex;flex-wrap:wrap;gap:.6rem}
.search-row input,.search-row select{flex:1;min-width:120px;padding:.65rem .8rem;border:1px solid #ddd;border-radius:10px;font-size:.92rem;background:#fafafa}
.search-row button{padding:.65rem 1.1rem;border:0;border-radius:10px;background:#ff5500;color:#fff;font-weight:700;font-size:.92rem;cursor:pointer}
.search-row button.sec{background:#eee;color:#333}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.chips button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:.35rem .75rem;font-size:.8rem;cursor:pointer}
.chips button.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.meta{max-width:1140px;margin:0 auto .5rem;padding:0 1rem;font-size:.85rem;color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.2rem;max-width:1140px;margin:0 auto;padding:0 1rem 2.5rem}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);display:flex;flex-direction:column}
.card a{text-decoration:none;color:inherit;flex:1}
.card-img{aspect-ratio:4/3;background:#eee;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:.85rem 1rem .4rem}
.price{font-size:1.2rem;font-weight:800;margin-bottom:.2rem;color:#ff5500}
h2{font-size:.92rem;font-weight:700;line-height:1.3}
.badge{font-size:.75rem;color:#666;margin-top:.2rem}
.card-actions{display:flex;gap:.45rem;padding:.7rem 1rem 1rem}
.btn-o,.btn-g{flex:1;text-align:center;padding:.5rem;border-radius:999px;font-size:.82rem;font-weight:700;text-decoration:none;color:#fff}
.btn-o{background:#ff5500}
.btn-g{background:#25d366}
footer{text-align:center;padding:1.2rem;color:#666;font-size:.85rem}
.loading{text-align:center;padding:3rem;color:#888}
.empty{text-align:center;padding:2rem;color:#888}
</style>
</head>
<body>
<header><span>●</span> ZonaProp Premium · Todos</header>
<h1>598 Departamentos (CABA + Mendoza)</h1>
<div class="search">
  <div class="search-box">
    <div class="search-row">
      <input id="q" type="search" placeholder="Zona o barrio (ej. Recoleta, Godoy Cruz)"/>
      <select id="precio">
        <option value="">Cualquier precio</option>
        <option value="0-50000">Hasta USD 50.000</option>
        <option value="50000-100000">USD 50.000 – 100.000</option>
        <option value="100000-200000">USD 100.000 – 200.000</option>
        <option value="200000-999999999">Más de USD 200.000</option>
      </select>
      <button id="btnBuscar" type="button">Buscar</button>
      <button id="btnLimpiar" class="sec" type="button">Limpiar</button>
    </div>
    <div class="chips" id="chips">
      <button type="button" data-z="Recoleta">Recoleta</button>
      <button type="button" data-z="Palermo">Palermo</button>
      <button type="button" data-z="Belgrano">Belgrano</button>
      <button type="button" data-z="Caballito">Caballito</button>
      <button type="button" data-z="Godoy Cruz">Godoy Cruz</button>
      <button type="button" data-z="Guaymallén">Guaymallén</button>
      <button type="button" data-z="Ciudad de Mendoza">Ciudad de Mendoza</button>
      <button type="button" data-z="Primera Sección">Primera Sección</button>
    </div>
  </div>
</div>
<div class="meta" id="meta"></div>
<div class="grid" id="grid"><div class="loading">Cargando...</div></div>
<footer id="footer">ZonaProp Premium · 598 departamentos</footer>
<script>
const HOME_LIMIT = 24;
let ALL = [];
let filtered = false;

function parsePrice(p) {
  if (!p) return 0;
  const n = String(p).replace(/[^0-9]/g, '');
  return n ? parseInt(n, 10) : 0;
}

function cardHTML(d) {
  const badge = [(d.photos||[]).length + ' fotos', d.ambientes, d.zona].filter(Boolean).join(' · ');
  return `<article class="card">
    <a href="depto.html?id=${d.id}">
      <div class="card-img">${d.main ? `<img src="${d.main}" alt="" loading="lazy">` : ''}</div>
      <div class="card-body">
        <div class="price">${d.price}</div>
        <h2>${d.title}</h2>
        <div class="badge">${badge}</div>
      </div>
    </a>
    <div class="card-actions">
      <a class="btn-o" href="depto.html?id=${d.id}">Ver</a>
      <a class="btn-g" href="https://wa.me/5491125692598?text=${encodeURIComponent('Hola! Quiero info de ' + d.title)}">WhatsApp</a>
    </div>
  </article>`;
}

function render(list, label) {
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');
  if (!list.length) {
    grid.innerHTML = '<div class="empty">No hay resultados</div>';
    meta.textContent = '';
    return;
  }
  const show = filtered ? list : list.slice(0, HOME_LIMIT);
  grid.innerHTML = show.map(cardHTML).join('');
  meta.textContent = filtered
    ? `${list.length} resultados`
    : `Mostrando ${show.length} de ${list.length} departamentos`;
}

function applyFilters() {
  const q = (document.getElementById('q').value || '').toLowerCase().trim();
  const precio = document.getElementById('precio').value;
  let list = ALL.slice();
  if (q) {
    list = list.filter(d =>
      (d.title || '').toLowerCase().includes(q) ||
      (d.zona || '').toLowerCase().includes(q) ||
      (d.desc || '').toLowerCase().includes(q)
    );
  }
  if (precio) {
    const [min, max] = precio.split('-').map(Number);
    list = list.filter(d => {
      const p = parsePrice(d.price);
      return p >= min && p <= max;
    });
  }
  filtered = !!(q || precio);
  render(list);
}

document.getElementById('btnBuscar').onclick = applyFilters;
document.getElementById('btnLimpiar').onclick = () => {
  document.getElementById('q').value = '';
  document.getElementById('precio').value = '';
  document.querySelectorAll('.chips button').forEach(b => b.classList.remove('on'));
  filtered = false;
  render(ALL);
};
document.getElementById('chips').onclick = (e) => {
  const btn = e.target.closest('button[data-z]');
  if (!btn) return;
  document.querySelectorAll('.chips button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('q').value = btn.dataset.z;
  applyFilters();
};

fetch('data.json').then(r => r.json()).then(data => {
  ALL = data;
  render(ALL);
}).catch(err => {
  document.getElementById('grid').innerHTML = '<div class="empty">Error cargando data.json</div>';
  console.error(err);
});
</script>
</body>
</html>
